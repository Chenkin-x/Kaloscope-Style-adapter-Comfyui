[project]
name = "kaloscope-style-adapter-comfyui"
description = "Kaloscope Z3 style adapters, artist search and reference-image conditioning for ComfyUI"
version = "1.1.0"
license = {file = "LICENSE"}
requires-python = ">=3.10"
dependencies = [
    "einops>=0.8.1", "torch>=2.4.1", "torchvision>=0.11.0", "timm>=1.0.20",
    "numpy>=1.19.0", "Pillow>=8.0.0", "scikit-image", "scikit-learn>=1.2.0",
    "scipy>=1.8.0", "matplotlib>=3.3.0", "tqdm>=4.60.0", "safetensors>=0.4.0",
    "triton-windows; sys_platform == 'win32'"
]

[project.optional-dependencies]
webui = ["gradio>=3.41,<6", "fastapi", "uvicorn", "python-multipart"]

[project.urls]
Repository = "https://github.com/222222222l/Kaloscope-Style-adapter-Comfyui"
Documentation = "https://github.com/222222222l/Kaloscope-Style-adapter-Comfyui#readme"
"Bug Tracker" = "https://github.com/222222222l/Kaloscope-Style-adapter-Comfyui/issues"

[tool.comfy]
DisplayName = "Kaloscope Style Adapter"
Icon = ""
includes = ["data", "web", "examples"]
